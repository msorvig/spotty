[package]
name = "spotty"
version = "0.1.0"
edition = "2021"
description = "AWS EC2 Spot Instance CLI"
license = "MIT"

[lib]
name = "spotty"
path = "src/lib.rs"

[[bin]]
name = "spotty"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
aws-config = "1"
aws-sdk-ec2 = "1"
aws-sdk-iam = "1"
aws-sdk-ssm = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tabled = "0.17"
anyhow = "1"
thiserror = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
fs2 = "0.4"
